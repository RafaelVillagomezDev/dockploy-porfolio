# Cabeceras de seguridad. Se incluye en cada bloque que use add_header,
# porque nginx no hereda los add_header del server si la location define los suyos.

# HSTS: forzar HTTPS durante 1 año (el TLS lo termina el proxy de Dokploy)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP: solo mi dominio + Google (Analytics, Tag Manager, Fonts)
# - Los sha256 corresponden a los dos <script> inline de index.html (gtag + GTM).
#   Si se modifican esos scripts hay que recalcular los hashes.
# - style-src necesita 'unsafe-inline' por styled-components y los style={{}} de React.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-arDrcWnY9nWJObAGB0X2s7H5CrwVbtnOI8Zx9EmRf6c=' 'sha256-sa4dBOuoShYaRz7QSWFa9DLCiHgai4ty03inqRWZxZ8=' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://yandrydev.cloud https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.googletagmanager.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# Clickjacking (equivalente legacy de frame-ancestors 'none')
add_header X-Frame-Options "DENY" always;

# Evitar MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enviar solo el origen a sitios externos
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Desactivar APIs del navegador que la app no usa
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), browsing-topics=()" always;
