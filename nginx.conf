server {
    listen 80;
    server_name _;


    root /usr/share/nginx/html;

    # Cabeceras de seguridad para todas las respuestas
    include /etc/nginx/snippets/security-headers.conf;

    # Configuración para el subdirectorio
    location /porfolio/ {
        index index.html;
        try_files $uri $uri/ /porfolio/index.html;
    }

    # Interceptor de archivos estáticos para aplicar caché
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|mp4|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Al usar add_header aquí se pierden los del server, así que se reincluyen
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Redirección de la raíz al subdirectorio
    location = / {
        return 301 /porfolio/;
    }
}
